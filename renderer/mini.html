<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>Trailmark Mini</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="task-tools.css"><link rel="stylesheet" href="productivity.css"><link rel="stylesheet" href="mini.css"><link rel="stylesheet" href="system.css"><link rel="stylesheet" href="appearance.css"><link rel="stylesheet" href="recall.css"></head><body><header class="mini-titlebar"><strong>trailmark <span>mini</span></strong><div><button id="mini-appearance-toggle" title="Appearance" aria-label="Appearance" aria-expanded="false">◐</button><button id="pin" title="Keep on top" aria-label="Keep on top" aria-pressed="false">⌖</button><button id="expand" title="Open workspace" aria-label="Open workspace">↗</button><button id="close-mini" title="Close mini" aria-label="Close mini">×</button></div></header><nav class="mini-tabs" aria-label="Mini views"><button data-mini-tab="focus" aria-pressed="true">Focus</button><button data-mini-tab="tasks" aria-pressed="false">Tasks</button><button data-mini-tab="activity" aria-pressed="false">Activity</button><button data-mini-tab="clipboard" aria-pressed="false">Clipboard</button><button data-mini-tab="launcher" aria-pressed="false">Apps</button></nav><main class="mini-main" tabindex="0" aria-label="Scrollable mini workspace"><section class="mini-appearance" id="mini-appearance" hidden><label class="field-label">Appearance<select id="mini-theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></label><label class="field-label">Surface<select id="mini-skin"><option value="graphite">Graphite · macOS inspired</option><option value="slate">Carbon · Windows inspired</option><option value="midnight">Midnight</option><option value="sand">Sand</option><option value="plum">Plum</option></select></label><div class="accent-options" id="mini-accents"></div><p class="meta">Applies to both windows and saves automatically.</p></section><div id="mini-resources" class="mini-resources"></div><section class="mini-focus" data-mini-panel="focus"><div class="eyebrow">SPACE FOR ONE THING</div><h1 id="focus-title">A little focus goes a long way.</h1><div class="mini-timer" id="timer">25:00</div><div class="mini-focus-actions"><button id="focus" class="button primary">Focus 25 min</button><button id="tracking" class="button">Start tracking</button></div></section><section class="mini-section" data-mini-panel="tasks"><div class="mini-section-heading"><h2>Up next</h2><span id="task-count"></span></div><form id="mini-capture"><input name="title" maxlength="240" required placeholder="Jot down a task…" aria-label="New task"><button aria-label="Add task">+</button></form><div id="tasks"></div><div id="wins" class="mini-wins"></div></section><section class="mini-section" data-mini-panel="activity"><div class="mini-section-heading"><h2>Today’s timeline</h2><span id="tracked-time"></span></div><div id="rhythm" class="mini-rhythm"></div><div id="timeline"></div></section><section class="mini-section" data-mini-panel="activity"><div class="mini-section-heading"><h2>Recent apps</h2><span id="live-state">Live</span></div><div id="apps"></div></section><section class="mini-section" data-mini-panel="clipboard" hidden><div class="mini-section-heading"><h2>Clipboard history</h2><span id="mini-clip-status"></span></div><button id="mini-clip-enable" class="button">Enable history</button><button id="mini-clip-save" class="button">Save current</button><input id="mini-clip-search" type="search" placeholder="Find saved text or links…" aria-label="Search clipboard history"><select id="mini-clip-filter" aria-label="Clipboard history filter"><option value="recent">Recent</option><option value="all">All history</option><option value="pinned">Pinned</option><option value="images">Images</option></select><div id="mini-clips"></div></section><section class="mini-section" data-mini-panel="launcher" hidden><div id="mini-launchers"></div></section></main><dialog id="mini-end-dialog"></dialog><div id="toast" role="status" aria-live="polite"></div><script src="data.js"></script><script src="productivity.js"></script><script src="task-tools.js"></script><script src="launcher.js"></script><script src="world-time.js"></script><script src="mini.js"></script></body></html>
