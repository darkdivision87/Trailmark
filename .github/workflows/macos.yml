name: Native macOS widgets
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native-macos
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Test native architecture
        run: swift test
      - name: Build app
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Trailmark-macOS-${{ matrix.arch }}
          path: native-macos/dist/Trailmark-macOS-${{ matrix.arch }}.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Trailmark-macOS-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" Trailmark-macOS-*.zip --title "Trailmark $TAG" --generate-notes
